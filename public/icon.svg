<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="leftFlapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base envelope body (darker interior) -->
  <path d="M 64 160 L 256 60 L 448 160 L 448 416 C 448 434 434 448 416 448 L 96 448 C 78 448 64 434 64 416 Z" fill="url(#bgGrad)" />

  <!-- Sheet of paper inside -->
  <rect x="100" y="150" width="312" height="230" rx="14" fill="#f8fafc" />
  <rect x="136" y="196" width="180" height="14" rx="7" fill="#e2e8f0" />
  <rect x="136" y="228" width="240" height="14" rx="7" fill="#e2e8f0" />
  <rect x="136" y="260" width="140" height="14" rx="7" fill="#e2e8f0" />

  <!-- Lower envelope pocket with shadow -->
  <g filter="url(#shadow)">
    <!-- Right triangle / fold -->
    <path d="M 448 180 L 256 310 L 448 432 Z" fill="#0284c7" />
    <!-- Left triangle / fold -->
    <path d="M 64 180 L 256 310 L 64 432 Z" fill="url(#leftFlapGrad)" />
    <!-- Bottom front flap -->
    <path d="M 64 432 L 256 295 L 448 432 C 448 441 441 448 432 448 L 80 448 C 71 448 64 441 64 432 Z" fill="url(#frontGrad)" />
  </g>
</svg>
